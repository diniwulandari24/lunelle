function canMove(x,z){if(Math.abs(x)>69||Math.abs(z)>69)return false;const h=terrainHeight(x,z);for(const c of colliders){if(Math.hypot(x-c.x,z-c.z)<c.r+.42)return false}for(const c of npcColliders){if(Math.hypot(x-c.x,z-c.z)<c.r+.42)return false}const riverX=8+(z+14)*.17;if(z>-20&&z<40&&Math.abs(x-riverX)<2.9){const onBridge=x>4&&x<13&&z>-5&&z<7;if(!onBridge)return false}return Number.isFinite(h)}
let clock=new THREE.Clock(),elapsed=0,steps=0;const camTarget=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;save.time+=dt/60;const inputX=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joyVector.x,inputZ=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joyVector.y;const len=Math.hypot(inputX,inputZ);if(len>.08&&!$('#overlay').classList.contains('open')){const speed=(running||keys.has('shift')?7.2:4.2)*dt,dx=inputX/len*speed,dz=inputZ/len*speed;const nx=player.position.x+dx,nz=player.position.z+dz;if(canMove(nx,player.position.z))player.position.x=nx;if(canMove(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(dx,dz);const stride=elapsed*(running?11:8);legs[0].rotation.x=Math.sin(stride)*.65;legs[1].rotation.x=-Math.sin(stride)*.65;arms[0].rotation.x=-Math.sin(stride)*.45;arms[1].rotation.x=Math.sin(stride)*.45;avatar.position.y=Math.abs(Math.sin(stride))*.04;steps+=dt;if(steps>.38){steps=0;if(!save.settings.muted&&audioCtx&&Math.random()<.25)sound(120,.04)}}else{legs.forEach(l=>l.rotation.x*=.8);arms.forEach(a=>a.rotation.x*=.8);avatar.position.y*=.8}const ground=terrainHeight(player.position.x,player.position.z);if(player.position.y>ground||jumpVelocity>0){player.position.y+=jumpVelocity*dt;jumpVelocity-=13*dt;if(player.position.y<ground){player.position.y=ground;jumpVelocity=0}}else player.position.y=ground;
const followOffset=new THREE.Vector3(0,11.5,17);camTarget.set(player.position.x,player.position.y+1,player.position.z);camera.position.lerp(camTarget.clone().add(followOffset),1-Math.pow(.001,dt));camera.lookAt(camTarget.x,camTarget.y+.35,camTarget.z-1.6);fire.intensity=2.0+Math.sin(elapsed*8)*.35;flame.scale.y=.85+Math.sin(elapsed*9)*.2;crystalMesh.rotation.y+=dt*.7;crystalMesh.position.y=1+Math.sin(elapsed*2)*.13;cLight.intensity=1.5+Math.sin(elapsed*2.6)*.35;nearestTarget();if(Math.floor(elapsed)%12===0&&Math.floor(elapsed)!==animate.lastSave){persist();animate.lastSave=Math.floor(elapsed)}if(Math.floor(elapsed/55)!==animate.lastTime){animate.lastTime=Math.floor(elapsed/55);const night=(animate.lastTime%4)/3;sun.intensity=2.3-night*.9;hemi.intensity=1.8-night*.65;scene.background.set(night>.68?'#344c5a':'#a9c5c6');scene.fog.color.set(night>.68?'#344c5a':'#a9c5c6');notify(['Pagi menyelimuti padang.','Matahari berada tinggi.','Senja mewarnai langit.','Malam turun di Sunny Meadow.'][animate.lastTime%4])}renderer.render(scene,camera)}
function start(){updateHud();for(const obj of interactables){if(obj.userData.type==='chest'&&save.interacted.chest){chestLid.rotation.x=-1.05}if(obj.userData.type==='herb'&&save.interacted[obj.userData.id])obj.visible=false}if(save.quests.crystal)crystal.visible=false;if(save.settings.quality==='low'){renderer.setPixelRatio(1);renderer.shadowMap.enabled=false}$('#hud').classList.add('visible');$('#loading').style.opacity='0';setTimeout(()=>$('#loading').remove(),550);animate();openPanel('menu');window.addEventListener('beforeunload',persist)}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();notify('Koneksi grafis terputus. Muat ulang halaman untuk melanjutkan.')});start();
